<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Финансовая крепость</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root {
  --paper: #EEF2EE; --sheet: #FAFCFA; --ink: #10302A; --ink-soft: #4C6660;
  --rule: #CBD7D1; --brass: #A8741C; --brass-soft: #F1E3C6; --green: #1F6B55; --green-soft: #D4E8DF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0C1A17; --sheet: #12241F; --ink: #E3EEE9; --ink-soft: #95ADA6;
    --rule: #284039; --brass: #E0AE57; --brass-soft: #3A2E17; --green: #6CC4A4; --green-soft: #173A30;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; padding: 0 16px; background: var(--paper); color: var(--ink);
  font-family: "Golos Text", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5;
  display: grid; place-items: center;
}
form {
  width: 100%; max-width: 380px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px;
  padding: 28px 24px; display: grid; gap: 16px;
}
.eyebrow { font-family: "JetBrains Mono", Consolas, monospace; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--brass); }
h1 { margin: 0; font-family: "Unbounded", "Arial Black", sans-serif; font-weight: 800; font-size: 1.6rem; line-height: 1.15; }
p { margin: 0; color: var(--ink-soft); font-size: .95rem; }
label { display: grid; gap: 6px; font-size: .85rem; color: var(--ink-soft); }
input {
  font: 500 1rem "JetBrains Mono", Consolas, monospace; color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 6px; padding: 12px; width: 100%;
}
input:focus { border-color: var(--green); outline: none; box-shadow: 0 0 0 3px var(--green-soft); }
button {
  font: 600 1rem "Golos Text", system-ui, sans-serif; color: var(--sheet); background: var(--green);
  border: 0; border-radius: 6px; padding: 12px; cursor: pointer;
}
button:disabled { opacity: .6; cursor: wait; }
button:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.err { background: var(--brass-soft); color: var(--ink); border-radius: 6px; padding: 10px 12px; font-size: .9rem; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<form id="gate">
  <span class="eyebrow">Закрытый доступ</span>
  <h1>Финансовая крепость</h1>
  <p>Пошаговый план накоплений по известным книгам о деньгах. Введите пароль, чтобы открыть сайт.</p>
  <label for="pw">Пароль<input id="pw" type="password" autocomplete="current-password" required autofocus></label>
  <div class="err" id="err" hidden></div>
  <button id="go" type="submit">Открыть</button>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: b64(P.s), iterations: P.n, hash: "SHA-256" }, base, 512));
  const iv = b64(P.i), ct = b64(P.c);
  const signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv); signed.set(ct, iv.length);
  const hk = await crypto.subtle.importKey("raw", bits.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
  if (!(await crypto.subtle.verify("HMAC", hk, b64(P.m), signed))) return null;
  const ak = await crypto.subtle.importKey("raw", bits.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, ak, ct));
}

document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Проверяю…"; err.hidden = true;
  try {
    const html = await unlock(document.getElementById("pw").value);
    if (html === null) {
      err.textContent = "Неверный пароль. Проверьте раскладку и регистр букв.";
      err.hidden = false;
    } else {
      document.open(); document.write(html); document.close();
      return;
    }
  } catch (x) {
    err.textContent = "Браузер не смог расшифровать страницу. Откройте сайт в свежей версии Chrome, Safari или Firefox.";
    err.hidden = false;
  }
  btn.disabled = false; btn.textContent = "Открыть";
});
